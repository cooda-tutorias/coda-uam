<!-- Modal Agendar Cita -->
<div class="modal fade" id="modalAgendarCita" tabindex="-1"
     aria-labelledby="modalAgendarCitaLabel" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalAgendarCitaLabel">
                    Agendar cita
                </h5>

                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">

                <!-- BLOQUE A → Selección de slots -->
                <div id="bloqueSlots" style="display:none;">
                    <div class="alert alert-info mt-3" id="nota-slots">
                       Tu tutor definió horarios de atención para tutorías. Solamente agenda en sus horarios disponibles para visitarlo.
                    </div>

                    <label class="form-label">Selecciona un horario:</label>
                    <select id="selectSlot" class="form-select mb-3"></select>

                    <label class="form-label">Selecciona una fecha:</label>
                    <select id="selectFecha" class="form-select mb-3"></select>
                </div>

                <!-- BLOQUE B → Sugerencia de fecha -->
                <div id="bloqueSugerencia" style="display:none;">
                    <div class="alert alert-info mt-3" id="nota-slots">
                       Tu tutor aún no registra horarios de atención para tutorías. Pero puedes sugerirle una fecha para visitarlo.
                    </div>

                    <label class="form-label">Sugiere una fecha</label>
                    <input id="inputSugerencia"
                           type="datetime-local"
                           class="form-control mb-3">
                    <a href="https://www.cua.uam.mx/servicios/sistemas-escolares/programacion-academica-de-evaluacion-global"
                         target="_blank" class="text-muted small">
                        <i class="bi bi-calendar-plus hover-primary"></i> Ver horarios de clases del profesor.
                    </a>
                </div>

            </div>

            <div class="modal-footer">
                <button id="btnAceptarCita"
                        type="button"
                        class="btn btn-primary">
                    Aceptar
                </button>
            </div>

        </div>
    </div>

</div>
