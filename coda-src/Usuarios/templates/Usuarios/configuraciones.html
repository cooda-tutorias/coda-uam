{% extends "Usuarios/perfil_base.html" %}

{% load static %}
{% block title %}Configuración{% endblock %}

{% block perfil %}

  <div class="d-flex justify-content-center">
    <div class="card border-top border-bottom border-4 my-4"
         style="border-color: #F08200 !important;
                border-radius: .5rem">
      <div class="card-body text-center">
        <h5 class="mb-3">Configuración de tu perfil</h5>

        <hr class="mt-0 mb-4">

        <div class="d-flex justify-content-between align-items-center">

          <div>
            <h6 class="mb-1">Notificaciones en este dispositivo</h6>
            <p class="text-muted small mb-0">
              <i class="fas fa-mobile-alt me-2"></i> Al activar, recibirás alertas académicas en este navegador.
            </p>
          </div>

          <div class="form-check form-switch ms-3">
            <input class="form-check-input"
                   type="checkbox"
                   role="switch"
                   id="pushNotificationSwitch"
                   style="transform: scale(1.2);
                          cursor: pointer">
            <label class="form-check-label" for="pushNotificationSwitch"></label>
          </div>
        </div>

        <div id="notificationStatusMsg"
             class="text-end mt-2"
             style="font-size: 0.85rem;
                    display: none"></div>

      </div>
    </div>
  </div>

{% endblock %}

{% block scripts %}
  <script>
    // El valor 'vapid_public_key' se pasa en el contexto de SettingsTutorView de views.py
    var vapidPublicKey = "{{ vapid_public_key }}"; 
    
    // Django convierte True/False de Python a "true"/"false" de JS
    var serverIsSubscribed = {{ is_push_active|yesno:"true,false" }};
  </script>

  <script src="{% static 'js/webpush_toggle_setup.js' %}"></script>
{% endblock %}
