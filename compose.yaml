services:
  db:
    image: postgres:17
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net
  seaweedfs:
    build:
      context: ./coda-src
      dockerfile: Dockerfile.seaweedfs
      args:
        SEAWEEDFS_VERSION: ${SEAWEEDFS_VERSION:-4.48}
    command:
      - mini
      - -dir=/data
      - -s3.port=8333
      - -s3.cert.file=/run/seaweedfs-server-tls/server.crt
      - -s3.key.file=/run/seaweedfs-server-tls/server.key
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-coda-app}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-coda-app-local-only}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET_NAME:-coda-media}
    volumes:
      - ./data/seaweedfs:/data
      - seaweedfs-server-tls:/run/seaweedfs-server-tls
      - seaweedfs-ca:/run/seaweedfs-ca
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          openssl s_client -connect 127.0.0.1:8333 -servername seaweedfs
          -CAfile /run/seaweedfs-ca/ca.crt -verify_hostname seaweedfs
          -verify_return_error </dev/null >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - app_net
  web:
    build: ./coda-src
    volumes:
      - ./media:/app/media
      - ./coda-src/static:/app/static
      - seaweedfs-ca:/run/seaweedfs-ca:ro
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - RDS_DB_NAME=${RDS_DB_NAME}
      - RDS_USERNAME=${RDS_USERNAME}
      - RDS_HOSTNAME=db
      - RDS_PORT=${RDS_PORT}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - IP_COMPUTADORA=${IP_COMPUTADORA}
      - LOCAL_HOST_NAME=${LOCAL_HOST_NAME}
      - TUTORIAS_DOMINIO=${TUTORIAS_DOMINIO}
      - EMAIL_DOMAIN=${EMAIL_DOMAIN}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - NOTIFICATIONS_EMAIL_HOST=${NOTIFICATIONS_EMAIL_HOST}
      - NOTIFICATIONS_EMAIL_PORT=${NOTIFICATIONS_EMAIL_PORT}
      - NOTIFICATIONS_EMAIL_TIMEOUT=${NOTIFICATIONS_EMAIL_TIMEOUT}
      - NOTIFICATIONS_EMAIL_USE_TLS=${NOTIFICATIONS_EMAIL_USE_TLS}
      - NOTIFICATIONS_EMAIL_USER=${NOTIFICATIONS_EMAIL_USER}
      - NOTIFICATIONS_EMAIL_PASSWORD=${NOTIFICATIONS_EMAIL_PASSWORD}
      - NOTIFICATIONS_EMAIL_FROM=${NOTIFICATIONS_EMAIL_FROM}
      - NOTIFICATIONS_EMAIL_LOGO_URL=${NOTIFICATIONS_EMAIL_LOGO_URL}
      - NOTIFICATIONS_UAM_ADDRESS=${NOTIFICATIONS_UAM_ADDRESS}
      - NOTIFICATIONS_UAM_MAPS_URL=${NOTIFICATIONS_UAM_MAPS_URL}
      - NOTIFICATIONS_UAM_PHONE=${NOTIFICATIONS_UAM_PHONE}
      - NOTIFICATIONS_CODDAA_PHONE=${NOTIFICATIONS_CODDAA_PHONE}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_ADMIN_EMAIL=${VAPID_ADMIN_EMAIL}
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OBJECT_STORAGE_ENABLED=${OBJECT_STORAGE_ENABLED:-False}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY:-coda-app}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY:-coda-app-local-only}
      - OBJECT_STORAGE_BUCKET_NAME=${OBJECT_STORAGE_BUCKET_NAME:-coda-media}
      - OBJECT_STORAGE_ENDPOINT_URL=${OBJECT_STORAGE_ENDPOINT_URL:-https://seaweedfs:8333}
      - OBJECT_STORAGE_CA_BUNDLE=${OBJECT_STORAGE_CA_BUNDLE:-/run/seaweedfs-ca/ca.crt}
      - OBJECT_STORAGE_REGION=${OBJECT_STORAGE_REGION:-us-east-1}
      - OBJECT_STORAGE_ADDRESSING_STYLE=${OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      - OBJECT_STORAGE_SIGNATURE_VERSION=${OBJECT_STORAGE_SIGNATURE_VERSION:-s3v4}
      - OBJECT_STORAGE_USE_TLS=${OBJECT_STORAGE_USE_TLS:-True}
      - OBJECT_STORAGE_MEDIA_PREFIX=${OBJECT_STORAGE_MEDIA_PREFIX:-media}
      - TRAYECTORIA_MAX_UPLOAD_SIZE=${TRAYECTORIA_MAX_UPLOAD_SIZE:-104857600}
      - FILE_UPLOAD_MAX_MEMORY_SIZE=${FILE_UPLOAD_MAX_MEMORY_SIZE:-2097152}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  seaweedfs-server-tls:
  seaweedfs-ca:
